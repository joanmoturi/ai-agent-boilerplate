[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ai-starter-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1",
  "PyJWT>=2.10,<3",
  "authlib>=1.4,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "openai>=1.68,<3",
  "structlog>=25.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.21", "ruff>=0.11", "mypy>=1.15"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires TEST_POSTGRES_URL and a disposable PostgreSQL pgvector database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["authlib.*", "pgvector.*"]
ignore_missing_imports = true
